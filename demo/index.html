<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulsar VPN</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-state="idle">
<div class="wall" aria-hidden="true">
  <div class="w w-idle"></div>
  <div class="w w-busy"></div>
  <div class="w w-on"></div>
</div>
<canvas id="liquid" aria-hidden="true"></canvas>
<svg id="lensDefs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

<div id="banner" class="banner glass hidden"></div>

<main id="app">
  <div class="topbar">
    <div class="chip glass" id="chip"><i class="dot"></i><span id="chipText">Not protected</span></div>
  </div>

  <section class="hero">
    <div class="stage" id="stage">
      <div class="rings"></div>
      <div class="core"></div>
      <div class="ripple"></div>
      <div class="orbit"><i></i></div>
      <button class="orb lensed" id="orb" data-bezel="44" data-scale="-64" aria-label="Connect">
        <span class="sheen"></span>
        <svg class="power" viewBox="0 0 24 24"><path d="M12 3.5v7.5"/><path d="M6.6 7a7.5 7.5 0 1 0 10.8 0"/></svg>
      </button>
    </div>
    <div class="status">
      <h1 id="statusTitle">Tap to connect</h1>
      <p id="statusSub">Finds the fastest server for you</p>
    </div>
  </section>

  <nav class="seg glass" id="mode">
    <div class="thumb lensed" id="thumb" data-bezel="16" data-scale="-26"></div>
    <button data-mode="gaming"><svg viewBox="0 0 24 24"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-3.9 3.2l-1 5.4A3 3 0 0 0 7 16l1.4-1.6a2 2 0 0 1 1.5-.7h4.2a2 2 0 0 1 1.5.7L17 16a3 3 0 0 0 5.2-2.4l-1-5.4A4 4 0 0 0 17.3 5z"/></svg>Gaming</button>
    <button data-mode="speed"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Speed</button>  </nav>

  <section class="card glass info">
    <button class="loc" id="openServers">
      <div class="flag" id="flag"></div>
      <div class="loc-text">
        <div class="loc-country" id="locCountry">Auto</div>
        <div class="loc-sub" id="locSub">Finding the fastest route</div>
      </div>
      <svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <div class="grid">
      <div><label>Ping</label><b id="ping">—</b></div>
      <div><label>IP address</label><b id="ip">—</b></div>
      <div><label>Protocol</label><b id="proto">—</b></div>
    </div>
  </section>

  <section class="card glass traffic">
    <span class="now-label">Using right now</span>
    <div class="rates">
      <div class="rate down"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></span><b id="down">0</b><small id="downU">Kbps</small></div>
      <div class="rate up"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></span><b id="up">0</b><small id="upU">Kbps</small></div>
    </div>
    <canvas id="spark" width="740" height="120"></canvas>
    <button class="speed-btn" id="speedBtn" title="Measure the real maximum of your internet">
      <svg viewBox="0 0 24 24"><path d="M12 14l4-5"/><path d="M3.5 17a9 9 0 1 1 17 0"/></svg><span id="speedBtnText">Test max speed</span>
    </button>
    <div class="st-panel" id="stPanel">
      <span class="st-label" id="stLabel">Line speed</span>
      <span class="st-num"><b id="stNum">0</b><small>Mbps</small></span>
      <span class="st-sub" id="stSub">Finding the nearest test server…</span>
      <span class="st-bar"><i id="stBar"></i></span>
    </div>
  </section>
</main>

<!-- Server sheet -->
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sheet-head">
    <div class="sheet-title"><h2>Servers</h2><span id="srvCount" class="count"></span></div>
    <div class="sheet-actions">
      <button class="btn" id="rescan" title="Rescan"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8.5"/><path d="M20 3.5v5h-5"/></svg></button>
      <button class="btn primary" id="importBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>My server</button>
    </div>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
    <input id="search" class="search" placeholder="Search" autocomplete="off">
  </div>
  <div class="list" id="list"></div>
</aside>

<!-- Engine modal -->
<div class="modal hidden" id="engineModal">
  <div class="modal-card glass">
    <div class="modal-icon"><svg viewBox="0 0 24 24"><path d="M12 2.5 4 6v6c0 4.6 3.4 8.8 8 9.5 4.6-.7 8-4.9 8-9.5V6z"/><path d="m9 12 2 2 4-4"/></svg></div>
    <h3 id="engTitle">One-time setup</h3>
    <p id="engText"></p>
    <div class="modal-progress hidden" id="engProg"><i></i></div>
    <div class="modal-btns">
      <button class="btn" id="engCancel">Later</button>
      <button class="btn primary" id="engInstall">Install engine</button>
    </div>
  </div>
</div>

<div class="toast glass" id="toast"></div>
<script src="demo-engine.js"></script>
<script src="liquid.js"></script>
<script src="app.js"></script>
</body>
</html>
