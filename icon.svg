<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".42" r=".75">
      <stop offset="0" stop-color="#3a2a9e"/>
      <stop offset=".45" stop-color="#140f3c"/>
      <stop offset="1" stop-color="#05050f"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".22" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".3" stop-color="#b4a6ff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#4fb3ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b5a8ff" stop-opacity=".9"/>
      <stop offset=".4" stop-color="#7a63ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7a63ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".36" cy=".3" r=".8">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".3" stop-color="#d9d2ff"/>
      <stop offset=".62" stop-color="#7f6bff"/>
      <stop offset="1" stop-color="#2b1f8f"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ef0b0" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#4fb3ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#3ef0b0" stop-opacity=".1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="sq"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- the two beams, sweeping out of the star along one axis -->
    <g transform="rotate(-38 256 256)">
      <path d="M256 256 L520 226 L520 286 Z" fill="url(#beam)" filter="url(#soft)"/>
      <path d="M256 256 L520 247 L520 265 Z" fill="url(#beam)"/><path d="M256 256 L520 253 L520 259 Z" fill="#fff" opacity=".9"/>
      <g transform="rotate(180 256 256)">
        <path d="M256 256 L520 226 L520 286 Z" fill="url(#beam)" filter="url(#soft)"/>
        <path d="M256 256 L520 247 L520 265 Z" fill="url(#beam)"/><path d="M256 256 L520 253 L520 259 Z" fill="#fff" opacity=".9"/>
      </g>
    </g>
    <circle cx="256" cy="256" r="150" fill="url(#halo)"/>
    <circle cx="256" cy="256" r="118" fill="none" stroke="#a99bff" stroke-opacity=".28" stroke-width="3"/>
    <circle cx="256" cy="256" r="168" fill="none" stroke="#a99bff" stroke-opacity=".12" stroke-width="3"/>
    <circle cx="256" cy="256" r="70" fill="url(#core)"/>
    <circle cx="256" cy="256" r="70" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
    <rect width="512" height="512" rx="116" fill="url(#rim)"/>
  </g>
  <rect x="1.5" y="1.5" width="509" height="509" rx="115" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
</svg>
